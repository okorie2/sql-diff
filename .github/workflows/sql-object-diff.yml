name: SQL Diff Report

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR head (data only, not checked out)
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SQL diff report
        run: |
          python scripts/sql-diff/main.py \
            --base-branch origin/main 

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Copy report into PR folder
        run: |
          mkdir -p pages/pr-${{ github.event.pull_request.number }}
          cp report/index.html pages/pr-${{ github.event.pull_request.number }}/index.html

      - name: Commit and push report
        run: |
          cd pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Update SQL diff report for PR #${{ github.event.pull_request.number }}" || echo "No changes to commit"

          git push origin gh-pages

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request.number;

            const reportUrl = `https://${owner}.github.io/${repo}/pr-${pr}/`;

            const body = `## SQL Migration Review

            Detailed report: ${reportUrl}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr,
              body
            });